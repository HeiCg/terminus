name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tool versions
        run: |
          openssl version
          node --version

      - name: Service scripts parse
        run: |
          for f in collector/scripts/launchd/*.sh collector/scripts/systemd/*.sh; do
            bash -n "$f"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck collector/scripts/launchd/*.sh collector/scripts/systemd/*.sh
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Svelte check
        run: npm run check:ui

      - name: Lint
        run: npm run lint

      - name: Build CLI
        run: npm run build -w @terminus/cli

      - name: Build MCP server
        run: npm run build -w @terminus/mcp

      # Playwright runs once, on Linux with Node 22 only: --with-deps is Linux-only
      # and the browser suite should not fan out across the OS/Node matrix.
      - name: Install Playwright Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        working-directory: collector
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        working-directory: collector
        run: npm run test:browser
