name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tool versions
        run: |
          openssl version
          node --version

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Svelte check
        run: npm run check:ui

      - name: Lint
        run: npm run lint

      - name: Build CLI
        run: npm run build -w @terminus/cli

      # Playwright runs once, on Linux only: --with-deps is Linux-only and the
      # browser suite should not fan out across the OS matrix.
      - name: Install Playwright Chromium
        if: matrix.os == 'ubuntu-latest'
        working-directory: collector
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: collector
        run: npm run test:browser
